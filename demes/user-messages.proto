syntax = "proto3";

package demes;

option go_package = "github.com/Lykeion-org/go-shared/pkg/grpc/generated/demes;demes";

message User{
    string uid = 1;
    string email_address = 2;
    string password_hash = 3;
    string email_address_hash = 4;
    string avatar_source = 5;
    int32 native_language = 6;
    int32 reference_language = 7;
    int32 target_language = 8;
    optional string first_name = 9;
    optional string last_name = 10;
    optional string extra_name = 11;
    optional string display_name = 12;
    int32 role = 13;
    bool verified = 14;
}
message CreateUserRequest{
    string email = 1;
    string password = 2;
}
message UserUidRequest{
    string uid = 1;
}
message UserMailRequest{
    string email_address = 1;
}
message ListUsersRequest{
    int32 limit = 1;
    int32 offset = 2;
}
message ListUsersResponse{
    repeated User users = 1;
    int32 total_count = 2;
    int32 page_size = 3;
    int32 current_page = 4;
}

message ValidatePasswordRequest{
    string email = 1;
    string password = 2;
}

message ValidatePasswordResponse{
    bool correct = 1;
}