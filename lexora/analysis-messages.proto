syntax = "proto3";

import "shared/language-types.proto";

package lexora;

option go_package = "github.com/Lykeion-org/go-shared/pkg/grpc/generated/lexora;lexora";

// Queues a text for the NLP worker. Words it finds that are not in the
// dictionary yet become word suggestions.
message AnalyzeTextAndAddToSuggestionsRequest {
    string text = 1;
    string requester_uid = 2;  // filled in by the gateway from the caller's token
    Language language = 3;     // only LANGUAGE_EN is analysed for now; unspecified means EN
}

message AnalyzeTextAndAddToSuggestionsResponse {
    string job_uid = 1;
    string user_uid = 2;
}

message ApproveSuggestionRequest {
    string word_suggestion_uid = 1;
    string approver_uid = 2;
}

message ApproveSuggestionResponse {
    Word word = 1;
    bool sucess = 2;
}
