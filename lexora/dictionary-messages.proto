syntax = "proto3";

import "shared/language-types.proto";

package lexora;

option go_package = "github.com/Lykeion-org/go-shared/pkg/grpc/generated/lexora;lexora";

//READ MESSAGES
message GetReferentRequest {
    string uid = 1;
}
message GetSymbolRequest {
    string uid = 1;
}
message GetWordRequest {
    string uid = 1;
}
message ListReferentsRequest {
    int32 page = 1;
    int32 page_size = 2;
}
message ListReferentsResponse{
    repeated Referent referents = 1;
    int32 total_count = 2;
}
enum SearchMode{
    SEARCH_MODE_UNSPECIFIED = 0;
    SEARCH_MODE_WORD = 1;
    SEARCH_MODE_SYMBOL_LEMMA = 2;
    SEARCH_MODE_ANY = 3;
}

message FindReferentsRequest {
    string query = 1;
    SearchMode search_mode = 2;
    Language language = 3;
    int32 page = 4;
    int32 page_size = 5;
}

message FindReferentsResponse {
    repeated Referent referents = 1;
    int32 total_count = 2;
}

//CREATE MESSAGES
message CreateReferentRequest {
    string en_reference = 1;
    optional string image_source = 2;
    repeated Symbol symbols = 3;
}
message CreateSymbolRequest {
    string referent_uid = 1;
    Language language = 2;
    SymbolType symbol_type = 3;
    optional Word lemma = 4;
    repeated Word words = 5;
}
message CreateWordRequest{
    string symbol_uid = 1;
    string word = 2;
    optional string sound_source = 3;
    optional string ipa = 4;
    WordType word_type = 5;
}
message CreateWordAttributesRequest{
    string word_uid = 1;
    WordGender gender = 2;
    WordNumber number = 3;
    bool unique = 4;
    bool diminutive = 5;
    WordCase case = 6;
    WordMood mood = 7;
    WordTense tense = 8;
    WordAspect aspect = 9;
    WordPerson person = 10;
    bool direct_object = 11;
    bool indirect_object = 12;
    int32 valency = 13;
    bool reflexive = 14;

}

//UPDATE MESSAGES
message UpdateReferentRequest {
    Referent referent = 1;
}
message UpdateSymbolRequest {
    Symbol symbol = 1;
}
message UpdateWordRequest {
    Word word = 1;
}
message UpdateWordAttributesRequest{
    WordAttributes attributes = 1;
}

//DELETE MESSAGES
message DeleteReferentRequest {
    string referent_uid = 1;
}
message DeleteSymbolRequest {
    string symbol_uid = 1;
}
message DeleteWordRequest {
    string word_uid = 1;
}
message DeleteWordAttributesRequest{
    string word_uid = 1;
}

//LINKING OPERATIONS MESSAGES
message LinkSymbolToReferentRequest {
    repeated string symbol_uid = 1;
    string referent_uid = 2;
}

message LinkSymbolToReferentResponse {
    bool succes = 1;
}

message LinkWordToSymbolRequest{
    repeated string word_uid = 1;
    string symbol_uid = 2;
}

message LinkWordToSymbolResponse{
    bool succes = 1;
}

message SetSymbolLemmaRequest{
    string word_uid = 1;
    string symbol_uid = 2;
}

message SetSymbolLemmaResponse{
    bool succes = 1;
}

message UnlinkSymbolFromReferentRequest{
    string symbol_uid = 1;
    string referent_uid = 2;
}
message UnlinkSymbolFromReferentResponse{
    bool success = 1;
}
message UnlinkWordFromSymbolRequest {
    string word_uid = 1;
    string symbol_uid = 2;
}
message UnlinkWordFromSymbolResponse{
    bool success = 1;
}
message ListAllLinkedReferentsRequest{
    string symbol_uid = 1;
    int32 page = 2;
    int32 page_size = 3;
    
}
message ListAllLinkedReferentsResponse{
    repeated string referent_uids = 1;
    int32 total_count = 2;
}
message ListAllLinkedSymbolsRequest{
    string word_uid = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message ListAllLinkedSymbolsResponse{
    repeated string symbols_uids = 1;
    int32 total_count = 2;
}

// A word found by the text analyser that is not in the dictionary yet.
message WordSuggestion {
    string uid = 1;
    string word = 2;           // the form as it appeared in the text
    string lemma = 3;
    Language language = 4;
    SymbolType symbol_type = 5;
    WordType word_type = 6;
    WordAttributes attributes = 7;
    string job_uid = 8;
    string requester_uid = 9;
    bool approved = 10;
    string approved_by = 11;
}
message CreateWordSuggestionRequest {
    WordSuggestion suggestion = 1;
}
message ListAllWordSuggestionRequest {
    int32 page = 1;
    int32 page_size = 2;
}
message ListAllWordSuggestionResponse {
    repeated WordSuggestion suggestions = 1;
    int32 total_count = 2;
}
message UpdateWordSuggestionRequest {
    
}
message DeleteWordSuggestionRequest {
    
}
