syntax = "proto3";

package paideia;

option go_package = "github.com/Lykeion-org/go-shared/pkg/grpc/generated/paideia;paideia";

service PaideiaService {
    rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
    rpc AssignFlashcardsFromCourse(AssignFlashcardsFromCourseRequest) returns (AssignFlashcardsFromCourseResponse);
    rpc AnswerFlashcard(AnswerFlashcardRequest) returns (AnswerFlashcardResponse);
    rpc CreateFlashcard(CreateFlashcardRequest) returns (CreateFlashcardResponse);
    rpc UpdateFlashcard(UpdateFlashcardRequest) returns (UpdateFlashcardResponse);
    rpc ListScheduledCard(ListScheduledCardRequest) returns (ListScheduledCardResponse);
}

message GetCourseRequest {
    string course_id = 1;
}

message GetCourseResponse {
    Course course = 1;
}

message AssignFlashcardsFromCourseRequest {
    string course_id = 1;
    string user_id = 2;
    int32 target_language = 3;
    int32 target_level = 4;
}

message AssignFlashcardsFromCourseResponse {
    string user_id = 1;
    repeated string added_card_ids = 2;
    bool success = 3;
}

message CreateFlashcard {
    string user_id = 1;
    string referent_id = 2;
    string reference_symbol_id = 3;
    string reference_word_id = 4;
    string target_symbol_id = 5; 
    string target_word_id = 6;
    string question_type = 7;
    string hint_type = 8;
    string answer_type = 9;
    string question_source = 10;
    string hint_source = 11;
    string answer_source = 12;
    string target_language = 13;
    string reference_language = 14;
}

message UpdateFlashcardRequest {
    string user_id = 1;
    string flashcard_id = 2;
    int32 quality = 3;
}

message AnswerFlashcardRequest{}

message ListScheduledCardRequest {
    string user_id = 1;
    string target_language = 2;
    string reference_language = 3;

}