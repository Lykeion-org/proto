syntax = "proto3";

package lexora;

option go_package = "github.com/Lykeion-org/go-shared/pkg/grpc/generated/shared;shared";

enum WordType {
    WORD_TYPE_UNSPECIFIED = 0;
    WORD_TYPE_NOUN = 1;
    WORD_TYPE_VERB = 2;
    WORD_TYPE_ADJECTIVE = 3;
    WORD_TYPE_ADVERB = 4;
    WORD_TYPE_PRONOUN = 5;
    WORD_TYPE_PREPOSITION = 6;
    WORD_TYPE_CONJUNCTION = 7;
    WORD_TYPE_INTERJECTION = 8;
    WORD_TYPE_DETERMINER = 9;
}

enum SymbolType {
    SYMBOL_TYPE_OBJECT = 0;
    SYMBOL_TYPE_ACTION = 1;
    SYMBOL_TYPE_MODIFIER = 2;
}

enum Language {
    LANGUAGE_UNSPECIFIED = 0;
    LANGUAGE_EN = 1;
    LANGUAGE_NL = 2;
    LANGUAGE_ES = 3;
    LANGUAGE_PT = 4;
    LANGUAGE_DE = 5;
    LANGUAGE_FR = 6;
}

enum WordTense {
    WORD_TENSE_UNSPECFIED = 0;
    WORD_TENSE_PAST = 1;
    WORD_TENSE_PRESENT = 2;
    WORD_TENSE_FUTURE = 3;
}

enum WordGender {
    WORD_GENDER_UNSPECIFIED = 0;
    WORD_GENDER_MALE = 1;
    WORD_GENDER_FEMALE = 2;
    WORD_GENDER_NEUTER = 3;
}

enum WordNumber {
    WORD_NUMBER_UNSPECIFIED = 0;
    WORD_NUMBER_SINGULAR = 1;
    WORD_NUMBER_PLURAL = 2;
}

enum WordMood {
    WORD_MOOD_UNSPECIFIED = 0;

}

enum WordAspect {
    WORD_ASPECT_UNSPECIFIED = 0;
}

enum WordPerson {
    WORD_PERSON_UNSPECIFIED = 0;
    WORD_PERSON_FIRST = 1;
    WORD_PERSON_SECOND = 2;
    WORD_PERSON_THIRD = 3;
}

enum WordCase {
    WORD_CASE_UNSPECIFIED = 0;
    WORD_CASE_NOMINATIVE = 1;
    WORD_CASE_GENITIVE = 2;
    WORD_CASE_DATIVE = 3;
    WORD_CASE_ACCUSATIVE = 4;
    WORD_CASE_INSTRUMENTAL = 5;
    WORD_CASE_LOCATIVE = 6;
    WORD_CASE_VOCATIVE = 7;
    WORD_CASE_ABLATIVE = 8;   
}

message Word {
    string uid = 1;
    string word = 2;
    string sound_source = 3;
    string ipa = 4;
    WordType word_type = 5;
    WordAttributes attributes = 6;
}

message Symbol {
    string uid = 1;
    Language language = 2;
    SymbolType symbol_type = 3;
    Word lemma = 4;
    repeated Word words = 5;
}

message Referent {
    string uid = 1;
    string en_reference = 2;
    string image_source = 3;
    repeated Symbol symbols = 4;
}

message ReferentAttributes {

}

message SymbolAttributes {
    int64 language_variation = 1;
    string origin_language = 2;
    string ancestor_word = 3;
}

message WordAttributes {
    WordGender gender = 1;
    WordNumber number = 2;
    bool unique = 3;
    bool diminutive = 4;
    WordCase case = 5;
    WordMood mood = 6;
    WordTense tense = 7;
    WordAspect aspect = 8;
    WordPerson person = 9;
    bool direct_object = 10;
    bool indirect_object = 11;
    int32 valency = 12;
    bool reflexive = 13;
}