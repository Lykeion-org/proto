name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compile every .proto
        run: protoc -I=. --include_imports --descriptor_set_out=/dev/null $(find . -name '*.proto' -not -path './.git/*' | sort)
